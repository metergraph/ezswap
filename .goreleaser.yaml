# Release builds: run by .github/workflows/release.yml on a v* tag.
version: 2

project_name: ezswap

before:
  hooks:
    - go mod download
    - go test ./...

builds:
  - id: ezswap
    main: ./cmd/ezswap
    binary: ezswap
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/metergraph/ezswap/internal/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Named outright, so download URLs never depend on the clone's git remote.
release:
  github:
    owner: metergraph
    name: ezswap

changelog:
  use: github
  sort: asc

homebrew_casks:
  - name: ezswap
    repository:
      owner: metergraph
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/metergraph/ezswap
    description: Find which of your LLM calls can move to a cheaper model, read against a noise floor
    license: Apache-2.0
    commit_author:
      name: metergraph-release
      email: noreply@metergraph.dev
    # The binaries are not notarized: clear the quarantine flag so macOS
    # runs the binary Homebrew installed.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/ezswap"]
          end
