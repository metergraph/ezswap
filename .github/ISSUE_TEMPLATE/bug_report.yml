name: Bug report
description: Something Replay did that it should not, or did not do that it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Issues are public: do not paste API keys, real prompts or replies, customer data or private trace files. A small synthetic trace that shows the problem is the most useful thing you can attach.

        Report security problems privately instead: https://github.com/metergraph/replay/security/advisories/new
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `metergraph-replay --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The command you ran, with keys and private paths removed.
      placeholder: metergraph-replay map traces.jsonl --models openai/gpt-5-mini
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The output or error. `--json` output helps.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Trace format
      options:
        - Recorded with metergraph-replay record
        - Replay JSONL
        - Raw provider logs (OpenAI, Helicone, LiteLLM)
        - Langfuse export
        - OpenTelemetry GenAI spans
        - Not about traces
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and how you installed Replay (Homebrew, npm, go install, release archive).
      placeholder: macOS 26, Homebrew
