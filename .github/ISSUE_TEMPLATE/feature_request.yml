name: Feature request
description: A question ezswap cannot answer yet, or a format or provider it should read.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out?
      description: The decision you are making, and what ezswap shows you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The output, option or format you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
