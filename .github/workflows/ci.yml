name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod and go.sum are tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/ezswap

  release-check:
    name: Release build and npm launcher on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the GoReleaser configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      - name: Build the npm packages
        run: node scripts/npm-packages.mjs 0.0.0-snapshot dist npm-out

      # The release's own publish commands, uploading nothing.
      - name: Dry-run the npm publish
        run: scripts/npm-publish.sh next --dry-run

      # Install the launcher and this runner's platform package from packed
      # tarballs, as npm would from the registry, and run the binary through
      # the launcher.
      - name: Run the launcher
        run: |
          platform="$(node -p '`ezswap-${process.platform}-${process.arch}`')"
          smoke="$RUNNER_TEMP/npm-smoke"
          mkdir -p "$smoke/pkgs"
          npm pack --silent --pack-destination "$smoke/pkgs" "./npm-out/$platform" ./npm-out/ezswap
          cd "$smoke"
          echo '{"private": true}' > package.json
          npm install --no-audit --no-fund "./pkgs/$platform-0.0.0-snapshot.tgz" ./pkgs/ezswap-0.0.0-snapshot.tgz
          version="$(node node_modules/ezswap/bin/ezswap.js --version)"
          echo "launcher ran: $version"
          # GoReleaser names a snapshot after the latest tag, so the prefix
          # changes with every release.
          case "$version" in *-SNAPSHOT-*) ;; *) echo "unexpected version"; exit 1 ;; esac
          npx --no-install ezswap demo --no-color > demo.txt
          head -n 5 demo.txt

  publication:
    name: Public contribution check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public references
        run: python3 scripts/check_publication.py origin/${{ github.event.repository.default_branch }}
